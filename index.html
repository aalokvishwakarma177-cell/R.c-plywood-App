<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#060d1f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="R.C. Plywood" />
  <title>R.C. Plywood Management</title>

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --navy-deep: #050b18;
      --navy-mid: #0a1628;
      --gold-main: #eab308;
      --gold-light: #fde047;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #050b18;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: radial-gradient(circle at 15% 15%, #0f2547 0%, #050b18 60%);
    }
    .orb {
      position: absolute;
      border-radius: 9999px;
      filter: blur(80px);
      opacity: 0.45;
      animation: floatOrb 18s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 380px; height: 380px;
      background: radial-gradient(circle, rgba(234, 179, 8, 0.35), transparent 70%);
      top: -80px; right: -60px;
    }
    .orb-2 {
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.32), transparent 70%);
      bottom: -100px; left: -100px;
      animation-delay: -6s;
    }
    .orb-3 {
      width: 280px; height: 280px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.22), transparent 70%);
      top: 45%; left: 45%;
      animation-delay: -11s;
    }
    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(35px, -30px) scale(1.12); }
    }
    .glass-panel {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.085) 0%, rgba(255, 255, 255, 0.03) 100%);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.22), 0 12px 40px -10px rgba(0, 0, 0, 0.55);
    }
    .glass-card {
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.07) 0%, rgba(15, 23, 42, 0.45) 100%);
      backdrop-filter: blur(20px) saturate(170%);
      -webkit-backdrop-filter: blur(20px) saturate(170%);
      border: 1px solid rgba(255, 255, 255, 0.11);
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.18), 0 8px 28px -8px rgba(0, 0, 0, 0.45);
    }
    .glass-dock {
      background: rgba(10, 22, 44, 0.72);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.25), 0 16px 40px rgba(0, 0, 0, 0.6);
    }
    .glass-input {
      background: rgba(5, 11, 24, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #f8fafc;
      transition: all 0.2s ease;
    }
    .glass-input:focus {
      outline: none;
      border-color: rgba(234, 179, 8, 0.75);
      box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.18);
      background: rgba(5, 11, 24, 0.78);
    }
    .btn-gold {
      background: linear-gradient(135deg, #facc15 0%, #eab308 50%, #ca8a04 100%);
      color: #050b18;
      font-weight: 700;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 8px 20px -4px rgba(234, 179, 8, 0.45);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .btn-gold:hover { filter: brightness(1.06); }
    .btn-gold:active { transform: scale(0.97); }
    .btn-glass {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .btn-glass:hover { background: rgba(255, 255, 255, 0.14); }
    .btn-glass:active { transform: scale(0.97); }
    .swatch-teak { background: repeating-linear-gradient(92deg, #9c6631 0px, #855223 6px, #b07840 12px, #7a491c 18px); }
    .swatch-walnut { background: repeating-linear-gradient(88deg, #4b3121 0px, #3b2416 7px, #5d3e2b 14px, #2f1b10 21px); }
    .swatch-oak { background: repeating-linear-gradient(91deg, #c8a271 0px, #b58d5b 6px, #d6b485 13px, #a8804e 19px); }
    .swatch-mahogany { background: repeating-linear-gradient(89deg, #6e281d 0px, #581e15 8px, #823326 15px, #47160f 22px); }
    .swatch-pine { background: repeating-linear-gradient(93deg, #dfc395 0px, #d1b07d 7px, #ebd4ad 14px, #c4a16c 20px); }
    .swatch-birch { background: repeating-linear-gradient(90deg, #e7d9c2 0px, #d8c6aa 6px, #f2e8d7 12px, #cab595 18px); }
    .swatch-wenge { background: repeating-linear-gradient(87deg, #2b211c 0px, #1e1612 6px, #3a2d26 12px, #140e0c 18px); }
    .swatch-charcoal { background: repeating-linear-gradient(90deg, #334155 0px, #1e293b 7px, #475569 14px, #0f172a 21px); }
    @media print {
      body * { visibility: hidden !important; }
      #printable-bill, #printable-bill * { visibility: visible !important; }
      #printable-bill {
        position: fixed !important; left: 0 !important; top: 0 !important; width: 100% !important;
        background: #ffffff !important; color: #000000 !important; box-shadow: none !important; border: none !important; padding: 16px !important;
      }
      .no-print { display: none !important; }
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 99px; }
  </style>
</head>

        search: <><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>,
        download: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>,
        upload: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></>,
        expense: <><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></>,

      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {paths[name] || null}

    const T = {

        expenseTitle: "Expense Note (e.g. Tempo, Tea, Labour)", expenseAmt: "Amount (₹)", save: "Save", cancel: "Cancel",
        search: "Search...", markPaid: "Mark Paid", back: "Back", invoice: "TAX INVOICE / ESTIMATE", billNo: "Bill No", date: "Date", sqft: "sq.ft", pcs: "pcs"
      },
      hi: {
        appTitle: "R.C. प्लाईवुड", appSub: "बिज़नेस मैनेजमेंट",
        nav: { dashboard: "डैशबोर्ड", newBill: "नया बिल", bills: "बिल्स", khata: "खाता", stock: "स्टॉक", settings: "सेटिंग्स" },
        totalSales: "कुल बिक्री", netProfit: "शुद्ध मुनाफा", pendingKhata: "बकाया खाता", totalExpenses: "दुकान खर्च",

        noKhataYet: "अभी कोई ग्राहक नहीं है। नया ग्राहक जोड़ें या बिल बनाएं।",

        addItem: "आइटम जोड़ें", itemName: "सामान का नाम (जैसे 19mm प्लाई)", unitType: "यूनिट", sheet: "शीट (Sq.Ft)", piece: "पीस",
        lengthFt: "लंबाई (ft)", widthFt: "चौड़ाई (ft)", qty: "मात्रा", rate: "दर (₹)", buyRate: "खरीद दर (₹)",
        subtotal: "उप-योग", gst: "जीएसटी (%)", discount: "छूट (₹)", grandTotal: "कुल राशि",
        paidNow: "जमा किया (₹)", balanceDue: "बकाया (उधार)", saveBill: "बिल सेव करें",
        printBill: "प्रिंट / PDF", shareWA: "व्हाट्सएप", copyMsg: "कॉपी करें", copied: "कॉपी हो गया!", delete: "हटाएं",
        paid: "जमा", partial: "आंशिक", unpaid: "उधार", addCustomer: "ग्राहक जोड़ें", receivePayment: "पैसा जमा करें",
        openingBal: "पिछला बकाया (₹)", sendReminder: "रिमाइंडर भेजें", addStock: "स्टॉक जोड़ें", category: "कैटेगरी",
        swatch: "लकड़ी का रंग", qtyInStock: "मौजूदा स्टॉक", minAlert: "कम स्टॉक अलर्ट", shopDetails: "दुकान की जानकारी",
        shopName: "दुकान का नाम", ownerName: "मालिक का नाम", address: "पता", gstin: "GSTIN (वैकल्पिक)", saveSettings: "सेटिंग्स सेव करें",
        backupRestore: "बैकअप और रीस्टोर", exportJson: "बैकअप डाउनलोड", importJson: "बैकअप रीस्टोर", clearAll: "सारा डेटा रीसेट करें",
        expenseTitle: "खर्च का विवरण (जैसे टेम्पो, चाय, मजदूरी)", expenseAmt: "राशि (₹)", save: "सेव करें", cancel: "रद्द करें",
        search: "खोजें...", markPaid: "पूरा जमा करें", back: "वापस", invoice: "बिल / एस्टीमेट", billNo: "बिल नं.", date: "दिनांक", sqft: "वर्ग फुट", pcs: "पीस"
      }

    const SWATCHES = [
      { id: "teak", label: "Teak", cls: "swatch-teak" },
      { id: "walnut", label: "Walnut", cls: "swatch-walnut" },
      { id: "oak", label: "Oak", cls: "swatch-oak" },
      { id: "mahogany", label: "Mahogany", cls: "swatch-mahogany" },
      { id: "pine", label: "Pine", cls: "swatch-pine" },
      { id: "birch", label: "Birch", cls: "swatch-birch" },
      { id: "wenge", label: "Wenge", cls: "swatch-wenge" },
      { id: "charcoal", label: "Charcoal", cls: "swatch-charcoal" }
    ];

    const STORAGE_KEY = "rc_plywood_liquid_glass_v1";
    const DEFAULT_STATE = {
      lang: "en",
      settings: { shopName: "R.C. Plywood", ownerName: "", phone: "", address: "", gstin: "", defaultGst: 18 },
      stock: [], customers: [], bills: [], expenses: []
    };

    const fmtINR = (n) => "₹" + Number(n || 0).toLocaleString("en-IN", { maximumFractionDigits: 2 });
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const todayStr = () => new Date().toISOString().slice(0, 10);

    function App() {
      const [data, setData] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) return { ...DEFAULT_STATE, ...JSON.parse(saved) };
        } catch (e) {}
        return DEFAULT_STATE;
      });
      const [tab, setTab] = useState("dashboard");
      const [selectedBillId, setSelectedBillId] = useState(null);
      const [toast, setToast] = useState("");
      const [showExpModal, setShowExpModal] = useState(false);

      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
      }, [data]);

      const t = T[data.lang || "en"];
      const notify = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2400); };

      const stats = useMemo(() => {
        const totalSales = data.bills.reduce((s, b) => s + Number(b.grandTotal || 0), 0);
        const totalCogs = data.bills.reduce((s, b) => s + Number(b.totalCost || 0), 0);
        const totalExpenses = data.expenses.reduce((s, e) => s + Number(e.amount || 0), 0);
        const netProfit = totalSales - totalCogs - totalExpenses;
        const pendingKhata = data.customers.reduce((s, c) => s + Math.max(0, Number(c.balance || 0)), 0);
        const lowStock = data.stock.filter((item) => Number(item.qty) <= Number(item.minAlert || 5));
        return { totalSales, totalCogs, totalExpenses, netProfit, pendingKhata, lowStock };
      }, [data]);

      const toggleLang = () => setData((d) => ({ ...d, lang: d.lang === "en" ? "hi" : "en" }));

      const copyText = (text) => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => notify(t.copied)).catch(() => notify(t.copied));
        } else {
          const ta = document.createElement("textarea");
          ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
          notify(t.copied);
        }
      };

      const buildBillText = (bill) => {
        const lines = [
          `*${data.settings.shopName || "R.C. Plywood"}*`,
          `${t.billNo}: ${bill.billNo} | ${t.date}: ${bill.date}`,
          `${t.customer}: ${bill.customerName}`,
          "------------------------",
          ...bill.items.map((it, idx) => {
            const dim = it.unit === "sheet" ? ` (${it.length}x${it.width}ft=${it.sqft}sqft x ${it.qty})` : ` (${it.qty} pcs)`;
            return `${idx + 1}. ${it.name}${dim} = ${fmtINR(it.amount)}`;
          }),
          "------------------------",
          `${t.subtotal}: ${fmtINR(bill.subtotal)}`,
          bill.gstPercent > 0 ? `GST (${bill.gstPercent}%): ${fmtINR(bill.gstAmount)}` : null,
          bill.discount > 0 ? `${t.discount}: -${fmtINR(bill.discount)}` : null,
          `*${t.grandTotal}: ${fmtINR(bill.grandTotal)}*`,
          `${t.paidNow}: ${fmtINR(bill.paidAmount)}`,
          bill.balance > 0 ? `*${t.balanceDue}: ${fmtINR(bill.balance)}*` : "Status: PAID"
        ].filter(Boolean);
        return lines.join("\n");
      };

      const openWhatsApp = (phone, message) => {
        const clean = String(phone || "").replace(/\D/g, "");
        const target = clean.length === 10 ? `91${clean}` : clean;
        const url = target ? `https://wa.me/${target}?text=${encodeURIComponent(message)}` : `https://wa.me/?text=${encodeURIComponent(message)}`;
        window.open(url, "_blank", "noopener,noreferrer");
      };

      const navItems = [
        { id: "dashboard", label: t.nav.dashboard, icon: "dashboard" },
        { id: "newBill", label: t.nav.newBill, icon: "plus" },
        { id: "bills", label: t.nav.bills, icon: "bill" },
        { id: "khata", label: t.nav.khata, icon: "khata" },

      return (

          )}

          <div className="relative z-10 flex min-h-screen">
            <aside className="hidden md:flex flex-col w-64 p-4 fixed inset-y-0 left-0 no-print">
              <div className="glass-panel rounded-3xl flex-1 flex flex-col p-4">
                <div className="flex items-center gap-3 px-2 py-2 mb-6">
                  <div className="w-10 h-10 rounded-2xl btn-gold flex items-center justify-center text-sm font-black">RC</div>
                  <div className="min-w-0">
                    <div className="font-bold text-white truncate">{data.settings.shopName || t.appTitle}</div>
                    <div className="text-xs text-amber-300/80">{t.appSub}</div>
                  </div>
                </div>
                <nav className="space-y-1.5 flex-1">
                  {navItems.map((item) => (
                    <button key={item.id} onClick={() => { setTab(item.id); setSelectedBillId(null); }}
                      className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-sm font-medium transition-all ${tab === item.id ? "btn-gold" : "text-slate-300 hover:bg-white/10 hover:text-white"}`}>
                      <Icon name={item.icon} size={18} /><span>{item.label}</span>
                    </button>
                  ))}
                </nav>
                <button onClick={toggleLang} className="mt-4 btn-glass rounded-2xl py-2.5 px-3 text-xs font-semibold flex items-center justify-between">
                  <span className="text-slate-300">Language / भाषा</span>
                  <span className="px-2 py-0.5 rounded-lg bg-amber-400/20 text-amber-300">{data.lang === "en" ? "EN → हिं" : "हिं → EN"}</span>
                </button>
              </div>
            </aside>

            <main className="flex-1 md:ml-64 pb-28 md:pb-10 px-4 pt-4 md:px-8 md:pt-6 max-w-6xl w-full mx-auto">
              <header className="md:hidden flex items-center justify-between glass-panel rounded-2xl px-4 py-3 mb-5 no-print">
                <div className="flex items-center gap-2.5">
                  <div className="w-9 h-9 rounded-xl btn-gold flex items-center justify-center text-xs font-black">RC</div>
                  <div>
                    <div className="font-bold text-sm leading-tight">{data.settings.shopName || t.appTitle}</div>
                    <div className="text-[11px] text-amber-300/80">{t.appSub}</div>
                  </div>
                </div>
                <button onClick={toggleLang} className="btn-glass px-3 py-1.5 rounded-xl text-xs font-bold text-amber-300">{data.lang === "en" ? "हिंदी" : "EN"}</button>
              </header>

              {tab === "dashboard" && <DashboardView t={t} data={data} stats={stats} onNewBill={() => setTab("newBill")} onAddExpense={() => setShowExpModal(true)} onOpenBill={(id) => { setSelectedBillId(id); setTab("bills"); }} />}
              {tab === "newBill" && <NewBillView t={t} data={data} setData={setData} notify={notify} onCreated={(id) => { setSelectedBillId(id); setTab("bills"); }} />}
              {tab === "bills" && <BillsView t={t} data={data} setData={setData} selectedBillId={selectedBillId} setSelectedBillId={setSelectedBillId} buildBillText={buildBillText} openWhatsApp={openWhatsApp} copyText={copyText} notify={notify} />}
              {tab === "khata" && <KhataView t={t} data={data} setData={setData} openWhatsApp={openWhatsApp} copyText={copyText} notify={notify} />}
              {tab === "stock" && <StockView t={t} data={data} setData={setData} notify={notify} />}
              {tab === "settings" && <SettingsView t={t} data={data} setData={setData} toggleLang={toggleLang} notify={notify} />}
            </main>
          </div>

          <nav className="md:hidden fixed bottom-3 left-3 right-3 z-40 glass-dock rounded-3xl px-2 py-2 flex items-center justify-around no-print">
            {navItems.map((item) => {
              const active = tab === item.id;
              return (
                <button key={item.id} onClick={() => { setTab(item.id); setSelectedBillId(null); }}
                  className={`flex flex-col items-center gap-0.5 px-2.5 py-1.5 rounded-2xl transition-all ${active ? "bg-amber-400 text-slate-950 font-bold" : "text-slate-300"}`}>
                  <Icon name={item.icon} size={18} /><span className="text-[10px] leading-none">{item.label}</span>
                </button>
              );
            })}
          </nav>

          {showExpModal && <ExpenseModal t={t} onClose={() => setShowExpModal(false)} onSave={(exp) => { setData((d) => ({ ...d, expenses: [exp, ...d.expenses] })); setShowExpModal(false); notify(t.save + " ✓"); }} />}
        </div>
      );
    }

    function DashboardView({ t, data, stats, onNewBill, onAddExpense, onOpenBill }) {
      const totalFlow = Math.max(1, stats.totalSales);
      const cogsPct = Math.min(100, (stats.totalCogs / totalFlow) * 100);
      const expPct = Math.min(100 - cogsPct, (stats.totalExpenses / totalFlow) * 100);
      const profitPct = Math.max(0, 100 - cogsPct - expPct);

      return (
        <div className="space-y-5">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div><h1 className="text-2xl font-bold tracking-tight">{t.nav.dashboard}</h1><p className="text-xs text-slate-400">{data.settings.shopName || t.appTitle}</p></div>
            <div className="flex gap-2">
              <button onClick={onAddExpense} className="btn-glass px-4 py-2.5 rounded-2xl text-xs font-semibold flex items-center gap-2"><Icon name="expense" size={16} /> {t.addExpense}</button>
              <button onClick={onNewBill} className="btn-gold px-4 py-2.5 rounded-2xl text-xs flex items-center gap-2"><Icon name="plus" size={16} /> {t.quickBill}</button>
            </div>
          </div>

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3.5">
            <div className="glass-card rounded-3xl p-4"><div className="text-xs text-slate-400">{t.totalSales}</div><div className="text-xl md:text-2xl font-bold text-white mt-1">{fmtINR(stats.totalSales)}</div></div>
            <div className="glass-card rounded-3xl p-4 border-amber-400/30"><div className="text-xs text-amber-300">{t.netProfit}</div><div className={`text-xl md:text-2xl font-bold mt-1 ${stats.netProfit >= 0 ? "text-emerald-400" : "text-rose-400"}`}>{fmtINR(stats.netProfit)}</div></div>
            <div className="glass-card rounded-3xl p-4"><div className="text-xs text-slate-400">{t.pendingKhata}</div><div className="text-xl md:text-2xl font-bold text-amber-300 mt-1">{fmtINR(stats.pendingKhata)}</div></div>
            <div className="glass-card rounded-3xl p-4"><div className="text-xs text-slate-400">{t.totalExpenses}</div><div className="text-xl md:text-2xl font-bold text-rose-300 mt-1">{fmtINR(stats.totalExpenses)}</div></div>
          </div>

          <div className="glass-panel rounded-3xl p-5">
            <div className="flex items-center justify-between mb-3"><h2 className="font-semibold text-sm">{t.profitBreakdown}</h2><span className="text-xs text-slate-400">{t.cogs}: {fmtINR(stats.totalCogs)}</span></div>
            <div className="h-4 rounded-full bg-white/10 overflow-hidden flex">
              <div style={{ width: `${cogsPct}%` }} className="bg-blue-500/80 h-full"></div>
              <div style={{ width: `${expPct}%` }} className="bg-rose-500/80 h-full"></div>
              <div style={{ width: `${profitPct}%` }} className="bg-emerald-400 h-full"></div>
            </div>
            <div className="flex flex-wrap gap-4 mt-3 text-xs text-slate-300">
              <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-blue-500"></span>{t.cogs}: {fmtINR(stats.totalCogs)}</span>
              <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-rose-500"></span>{t.totalExpenses}: {fmtINR(stats.totalExpenses)}</span>
              <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>{t.netProfit}: {fmtINR(stats.netProfit)}</span>
            </div>
          </div>

          <div className="grid md:grid-cols-2 gap-4">
            <div className="glass-panel rounded-3xl p-5">
              <h2 className="font-semibold text-sm mb-3">{t.recentBills}</h2>
              {data.bills.length === 0 ? <p className="text-xs text-slate-400 py-6 text-center">{t.noBillsYet}</p> : (
                <div className="space-y-2.5">
                  {data.bills.slice(0, 5).map((b) => (
                    <button key={b.id} onClick={() => onOpenBill(b.id)} className="w-full text-left glass-card rounded-2xl p-3 flex items-center justify-between hover:border-amber-400/40 transition">
                      <div><div className="font-semibold text-sm">{b.customerName}</div><div className="text-[11px] text-slate-400">{b.billNo} • {b.date}</div></div>
                      <div className="text-right"><div className="font-bold text-sm text-amber-300">{fmtINR(b.grandTotal)}</div><div className={`text-[10px] font-bold ${b.balance <= 0 ? "text-emerald-400" : "text-rose-400"}`}>{b.balance <= 0 ? t.paid : `${t.balanceDue}: ${fmtINR(b.balance)}`}</div></div>
                    </button>
                  ))}
                </div>
              )}
            </div>
            <div className="glass-panel rounded-3xl p-5">
              <h2 className="font-semibold text-sm mb-3">{t.lowStock}</h2>
              {data.stock.length === 0 ? <p className="text-xs text-slate-400 py-6 text-center">{t.noStockYet}</p> : stats.lowStock.length === 0 ? <p className="text-xs text-emerald-400/90 py-6 text-center">{t.noLowStock}</p> : (
                <div className="space-y-2.5">
                  {stats.lowStock.map((it) => (
                    <div key={it.id} className="glass-card rounded-2xl p-3 flex items-center justify-between">
                      <div className="flex items-center gap-3"><div className={`w-8 h-8 rounded-xl swatch-${it.swatch || "teak"} border border-white/20`}></div><div><div className="font-semibold text-sm">{it.name}</div><div className="text-[11px] text-slate-400">{it.category}</div></div></div>
                      <span className="px-2.5 py-1 rounded-xl bg-rose-500/20 text-rose-300 text-xs font-bold">{it.qty} left</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function NewBillView({ t, data, setData, notify, onCreated }) {
      const [customerId, setCustomerId] = useState("");
      const [customName, setCustomName] = useState("");
      const [customPhone, setCustomPhone] = useState("");
      const [gstPercent, setGstPercent] = useState(Number(data.settings.defaultGst ?? 18));
      const [discount, setDiscount] = useState(0);
      const [paidAmount, setPaidAmount] = useState("");
      const [items, setItems] = useState([{ id: uid(), stockId: "", name: "", unit: "sheet", length: 8, width: 4, qty: 1, rate: "", buyRate: "" }]);

      const updateItem = (id, patch) => setItems((prev) => prev.map((it) => (it.id === id ? { ...it, ...patch } : it)));
      const selectStockItem = (rowId, stockId) => {
        const found = data.stock.find((s) => s.id === stockId);
        if (!found) { updateItem(rowId, { stockId: "" }); return; }
        updateItem(rowId, { stockId: found.id, name: found.name, unit: found.unit || "sheet", length: found.unit === "sheet" ? 8 : 1, width: found.unit === "sheet" ? 4 : 1, rate: found.sellRate, buyRate: found.buyRate || 0 });
      };

      const calcRow = (it) => {
        const q = Number(it.qty || 0), r = Number(it.rate || 0), br = Number(it.buyRate || 0);
        if (it.unit === "sheet") { const sqft = Number(it.length || 0) * Number(it.width || 0); return { sqft, amount: sqft * q * r, cost: sqft * q * br }; }
        return { sqft: 0, amount: q * r, cost: q * br };
      };

      const subtotal = items.reduce((s, it) => s + calcRow(it).amount, 0);
      const totalCost = items.reduce((s, it) => s + calcRow(it).cost, 0);
      const gstAmount = (subtotal * Number(gstPercent || 0)) / 100;
      const grandTotal = Math.max(0, Math.round(subtotal + gstAmount - Number(discount || 0)));
      const paid = paidAmount === "" ? grandTotal : Number(paidAmount || 0);
      const balance = Math.max(0, grandTotal - paid);

      const handleSave = (e) => {
        e.preventDefault();
        const validItems = items.filter((it) => it.name.trim() && Number(it.rate) > 0 && Number(it.qty) > 0);
        if (validItems.length === 0) { notify("Add at least 1 valid item"); return; }
        let custName = customName.trim() || t.walkIn, custPhone = customPhone.trim(), finalCustId = customerId;
        const nextCustomers = [...data.customers];
        if (customerId) {
          const idx = nextCustomers.findIndex((c) => c.id === customerId);
          if (idx >= 0) {
            custName = nextCustomers[idx].name; custPhone = nextCustomers[idx].phone;
            nextCustomers[idx] = { ...nextCustomers[idx], balance: Number(nextCustomers[idx].balance || 0) + balance, ledger: [{ id: uid(), date: todayStr(), type: "bill", amount: grandTotal, paid, note: "Bill" }, ...(nextCustomers[idx].ledger || [])] };
          }
        } else if (customName.trim() && balance > 0) {
          finalCustId = uid();
          nextCustomers.unshift({ id: finalCustId, name: custName, phone: custPhone, balance, ledger: [{ id: uid(), date: todayStr(), type: "bill", amount: grandTotal, paid, note: "Bill" }] });
        }
        const nextStock = data.stock.map((s) => {
          const used = validItems.filter((vi) => vi.stockId === s.id).reduce((sum, vi) => sum + Number(vi.qty || 0), 0);
          return used > 0 ? { ...s, qty: Math.max(0, Number(s.qty) - used) } : s;
        });
        const billId = uid(), billNo = `RC-${String(data.bills.length + 1).padStart(3, "0")}`;
        const newBill = {
          id: billId, billNo, date: todayStr(), customerId: finalCustId, customerName: custName, customerPhone: custPhone,
          items: validItems.map((it) => { const c = calcRow(it); return { ...it, sqft: c.sqft, amount: c.amount, cost: c.cost }; }),
          subtotal, totalCost, gstPercent: Number(gstPercent || 0), gstAmount, discount: Number(discount || 0), grandTotal, paidAmount: paid, balance
        };
        setData((d) => ({ ...d, bills: [newBill, ...d.bills], customers: nextCustomers, stock: nextStock }));
        notify(`${billNo} Saved ✓`);
        onCreated(billId);
      };

      return (
        <form onSubmit={handleSave} className="space-y-5">
          <h1 className="text-2xl font-bold">{t.nav.newBill}</h1>
          <div className="glass-panel rounded-3xl p-4 md:p-5 grid md:grid-cols-3 gap-3">
            <div>
              <label className="text-xs text-slate-400 block mb-1">{t.customer}</label>
              <select value={customerId} onChange={(e) => setCustomerId(e.target.value)} className="w-full glass-input rounded-2xl px-3.5 py-2.5 text-sm">
                <option value="">+ {t
